  <!-- Tracking e Analytics (Placeholders) -->

  <!-- Google Tag Manager Placeholder -->
</head>

<body>

  <!-- Planet -->
  <svg viewBox="-500 -500 1000 1000">
    <circle r="450"></circle>
    <circle class="equator" r="450"></circle>
    <circle class="meridian" r="450" style="--start:165deg; --end:180deg"></circle>
    <circle class="meridian" r="450" style="--start:150deg; --end:165deg"></circle>
    <circle class="meridian" r="450" style="--start:135deg; --end:150deg"></circle>
    <circle class="meridian" r="450" style="--start:120deg; --end:135deg"></circle>
    <circle class="meridian" r="450" style="--start:105deg; --end:120deg"></circle>
    <circle class="meridian" r="450" style="--start:90deg; --end:105deg"></circle>
    <circle class="meridian" r="450" style="--start:75deg; --end:90deg"></circle>
    <circle class="meridian" r="450" style="--start:60deg; --end:75deg"></circle>
    <circle class="meridian" r="450" style="--start:45deg; --end:60deg"></circle>
    <circle class="meridian" r="450" style="--start:30deg; --end:45deg"></circle>
    <circle class="meridian" r="450" style="--start:15deg; --end:30deg"></circle>
    <circle class="meridian" r="450" style="--start:0deg; --end:15deg"></circle>
  </svg>

  <!-- Historico de Alertas -->
  <div class="github-status-box">
    <div class="github-graph-header">
      <h4>Historico</h4>
      <span class="contributions-count">102 variações no ultimo ano</span>
    </div>
    <div class="github-graph" id="github-graph"></div>
    <div class="github-graph-footer">
      <span>Menos</span>
      <div class="legend">
        <span class="square" data-level="0"></span>
        <span class="square" data-level="1"></span>
        <span class="square" data-level="2"></span>
        <span class="square" data-level="3"></span>
        <span class="square" data-level="4"></span>
      </div>
      <span>Mais</span>
    </div>
  </div>

  <script>
    // Generate "GitHub Graph"
    const graphContainer = document.getElementById('github-graph');
    if (graphContainer) {
      const cols = 22;
      const rows = 7;
      for (let i = 0; i < cols * rows; i++) {
        const square = document.createElement('div');
        square.classList.add('square');
        // Randomly generate some activity
        const level = Math.random() > 0.7 ? Math.floor(Math.random() * 4) + 1 : 0;
        square.setAttribute('data-level', level);
        graphContainer.appendChild(square);
      }
    }
  </script>
</body>

</html>
