<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Connect - Central de Recursos</title>
  <script src="assets/js/components/head.js"></script>
</head>

<body>
  <div id="sidebar-container"></div>

  <section class="content">
    <main class="main-content">
      <div id="header-container" data-title="Fluxo de Interações"
        data-subtitle="Histórico e Correlações - Mission Control" data-description="Sistema de controle hídrico">
      </div>

      <div class="flow-container">


        <div class="flow-board" id="flow-board">
          <div class="flow-board-content" id="flow-board-content">
            <svg class="flow-svg"></svg>
          </div>

          <div class="zoom-controls" role="toolbar" aria-label="Controles de Zoom">
            <button id="zoom-in-btn" title="Aumentar Zoom" aria-label="Aumentar Zoom"><i
                class="fa-solid fa-magnifying-glass-plus"></i></button>
            <button id="zoom-out-btn" title="Diminuir Zoom" aria-label="Diminuir Zoom"><i
                class="fa-solid fa-magnifying-glass-minus"></i></button>
            <button id="zoom-reset-btn" title="Resetar Visualização" aria-label="Resetar Visualização"><i
                class="fa-solid fa-expand"></i></button>
          </div>
        </div>

        <div class="mobile-view-container" id="mobile-view-container"></div>
      </div>
    </main>

    <div class="right-panel"></div>
  </section>

  <div id="bottombar-container"></div>

  <script src="assets/js/components/sidebar.js"></script>
  <script src="assets/js/components/bottombar.js"></script>
  <script src="assets/js/components/header.js"></script>
  <script src="assets/js/components/router.js"></script>
  <script src="assets/js/pages/flow.js"></script>
</body>

</html>
